name: Auto Add SEO Descriptions

on:
  pull_request:
    paths:
      - 'docs/en/**/*.md'
    types: [opened, synchronize]
  push:
    branches:
      - dev
      - 'rel-*'
    paths:
      - 'docs/en/**/*.md'

jobs:
  add-seo-descriptions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            docs/en/**/*.md

      - name: Process changed files and add SEO descriptions
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import re
          from openai import OpenAI

          client = OpenAI(api_key=os.environ['OPENAI_API_KEY'])

          def has_seo_description(content):
              """Check if SEO JSON block already exists"""
              return bool(re.search(r'```json\s*//\[doc-seo\]', content, re.IGNORECASE))

          def get_content_preview(content, max_length=2000):
              """Get cleaned preview of content for OpenAI"""
              # Remove previous SEO sections if any
              content = re.sub(r'```json\s*//\[doc-seo\][\s\S]*?```', '', content)
              return content.strip()[:max_length]

          def generate_description(content, filename):
              """Generate a meta description using OpenAI"""
              try:
                  preview = get_content_preview(content)
                  response = client.chat.completions.create(
                      model="gpt-4o-mini",
                      messages=[
                          {"role": "system", "content": "You are a technical documentation SEO expert."},
                          {"role": "user", "content": f"""Generate a concise, informative meta description for this documentation page.

          File: {filename}
          Content Preview:
          {preview}

          Requirements:
          - Maximum 150 characters
          - Focus on what developers will learn
          - Include key technical terms
          - Make it engaging and clear
          - Do not use quotes or special formatting

          Generate only the description text, nothing else."""}
                      ],
                      max_tokens=150,
                      temperature=0.7
                  )
                  description = response.choices[0].message.content.strip()
                  if len(description) > 150:
                      description = description[:147] + "..."
                  return description
              except Exception as e:
                  print(f"❌ Error generating description: {e}")
                  return f"Learn about {os.path.splitext(filename)[0]} in ABP Framework documentation."

          def add_seo_description(content, description):
              """Prepend SEO description JSON block"""
              escaped = description.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n')
              block = (
                  "```json\n"
                  "//[doc-seo]\n"
                  "{\n"
                  f'    "Description": "{escaped}"\n'
                  "}\n"
                  "```\n\n"
              )
              return block + content

          changed_files = os.getenv('CHANGED_FILES', '').split()
          processed = 0
          skipped = 0

          print("🤖 Processing changed markdown files...\n")

          for filepath in changed_files:
              if not filepath.endswith('.md'):
                  continue

              print(f"📄 Processing: {filepath}")
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()

                  if has_seo_description(content):
                      print("   ⏭️  Skipped (already has SEO description)\n")
                      skipped += 1
                      continue

                  print("   🤖 Generating description...")
                  description = generate_description(content, os.path.basename(filepath))
                  print(f"   💡 Generated: {description}")

                  new_content = add_seo_description(content, description)
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(new_content)

                  print("   ✅ Updated successfully\n")
                  processed += 1

              except Exception as e:
                  print(f"   ❌ Error: {e}\n")

          print(f"\n📊 Summary:")
          print(f"   ✅ Updated: {processed}")
          print(f"   ⏭️  Skipped: {skipped}")

          with open('/tmp/seo_stats.txt', 'w') as f:
              f.write(f"{processed}\n{skipped}")
          PYTHON_SCRIPT

      - name: Commit changes if any
        id: commit
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add docs/en/**/*.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_commits=false" >> $GITHUB_OUTPUT
          else
            git commit -m "docs: Add SEO descriptions to modified documentation files [skip ci]"
            git push
            echo "has_commits=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.commit.outputs.has_commits == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stats = fs.readFileSync('/tmp/seo_stats.txt', 'utf8').split('\n');
            const processedCount = parseInt(stats[0]) || 0;
            const skippedCount = parseInt(stats[1]) || 0;

            if (processedCount > 0) {
              const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'
                .split(/\s+/)
                .filter(f => f.endsWith('.md'));

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🤖 **Auto SEO Bot**\n\n✅ Automatically added SEO descriptions to **${processedCount}** documentation file(s).\n${skippedCount > 0 ? `⏭️  Skipped **${skippedCount}** file(s) that already had descriptions.\n` : ''}\n**Modified files:**\n${changedFiles.slice(0, 10).map(f => \`- \\\`\${f}\\\`\`).join('\\n')}${changedFiles.length > 10 ? \`\\n- ... and \${changedFiles.length - 10} more\` : ''}\n\nDescriptions generated using OpenAI (gpt-4o-mini) to improve SEO and search engine visibility. 🚀`
              });
            }
