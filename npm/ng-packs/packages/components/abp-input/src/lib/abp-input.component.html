<div class="form-group" [formGroup]="abpInputFormGroup">
  <label [for]="id()">{{ label() | abpLocalization }}</label>
  <input
    [type]="type()"
    [id]="id()"
    class="form-control"
    [placeholder]="placeholder()"
    formControlName="value"
  />
  @if (errors.length > 0) {
    <div class="invalid-feedback d-block">
      @for (error of errors; track error) {
        <div>{{ error }}</div>
      }
    </div>
  }
  <div></div>
</div>
